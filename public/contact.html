<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Modern Web App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">BrandName</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
      <button class="hamburger" aria-label="Toggle Navigation">☰</button>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section class="container">
      <h2 class="section-title">Contact Us</h2>
      <div class="contact-wrapper">
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" placeholder="How can we help you?"></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
          <div id="formMessage" class="form-message"></div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 BrandName. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
